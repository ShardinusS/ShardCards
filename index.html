<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ShardCards">
    <meta name="theme-color" content="#2196F3">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ShardCards</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icon-1024.png">
    <link rel="apple-touch-icon" sizes="1024x1024" href="icon-1024.png">
    <link rel="apple-touch-icon-precomposed" sizes="1024x1024" href="icon-1024.png">
    <link rel="icon" type="image/png" sizes="1024x1024" href="icon-1024.png">
</head>
<body>
    <div id="notification-toast" class="notification-toast hidden">
        <div class="notification-toast-content">
            <div class="notification-toast-message" id="notification-toast-message">Il est temps de réviser</div>
            <button id="notification-toast-ok" class="notification-toast-btn">OK</button>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <div id="confirm-modal" class="confirm-modal-overlay hidden">
        <div class="confirm-modal">
            <div class="confirm-modal-icon" id="confirm-modal-icon"></div>
            <h3 id="confirm-modal-title">Confirmation</h3>
            <p id="confirm-modal-message">Êtes-vous sûr ?</p>
            <div class="confirm-modal-actions">
                <button id="confirm-modal-cancel" class="btn btn-secondary">Annuler</button>
                <button id="confirm-modal-confirm" class="btn btn-danger">Confirmer</button>
            </div>
        </div>
    </div>
    <div id="decks-view" class="view active">
        <header>
            <img src="icon-1024.png" alt="ShardCards" class="header-logo">
            <h1 class="header-title">ShardCards</h1>
            <div class="header-actions">
                <button id="hamburger-menu-btn" class="icon-btn" aria-label="Menu" title="Menu">
                    <span class="icon-svg icon-menu"></span>
                </button>
            </div>
        </header>
        <div class="deck-sections">
            <button class="deck-section-btn active" data-section="my-decks">
                <span>Mes Decks</span>
            </button>
            <button class="deck-section-btn" data-section="base-decks">
                <span>Decks de Base</span>
            </button>
        </div>
        <div id="my-decks-container" class="decks-section-content active">
            <div id="decks-container" class="decks-grid"></div>
        </div>
        <div id="base-decks-container" class="decks-section-content">
            <div id="base-decks-grid" class="decks-grid"></div>
        </div>
        <div class="fab-container">
            <button id="help-btn" class="fab help-fab" aria-label="Aide" title="Aide">
                <span class="icon-svg icon-help"></span>
            </button>
            <button id="add-deck-btn" class="fab" aria-label="Ajouter un deck">
                <span class="icon-svg icon-plus"></span>
            </button>
        </div>
    </div>
    <div id="deck-detail-view" class="view">
        <header>
            <button id="back-btn" class="icon-btn" aria-label="Retour">
                <span class="icon-svg icon-arrow-left"></span>
            </button>
            <h1 id="deck-title">Deck</h1>
            <div class="header-actions">
                <button id="hamburger-menu-btn-detail" class="icon-btn" aria-label="Menu" title="Menu">
                    <span class="icon-svg icon-menu"></span>
                </button>
            </div>
        </header>
        <div class="cards-toolbar">
            <div class="search-container">
                <span class="search-icon icon-svg"></span>
                <input type="text" id="cards-search" placeholder="Rechercher une carte..." autocomplete="off">
                <button id="clear-search" class="clear-search-btn hidden" aria-label="Effacer">&times;</button>
            </div>
            <div class="sort-container">
                <select id="cards-sort" aria-label="Trier par">
                    <option value="default">Tri par défaut</option>
                    <option value="score-asc">Difficulté ↑</option>
                    <option value="score-desc">Difficulté ↓</option>
                    <option value="alpha-asc">A → Z</option>
                    <option value="alpha-desc">Z → A</option>
                    <option value="review">Prochaine révision</option>
                </select>
            </div>
        </div>
        <div id="cards-container" class="cards-list"></div>
        <div class="fab-container">
            <button id="add-card-btn" class="fab" aria-label="Ajouter une carte">
                <span class="icon-svg icon-plus"></span>
            </button>
        </div>
    </div>
    <div id="review-view" class="view">
        <header>
            <button id="review-back-btn" class="icon-btn" aria-label="Retour">
                <span class="icon-svg icon-arrow-left"></span>
            </button>
            <h1>Révision</h1>
            <div id="review-progress">0 / 0</div>
        </header>
        <div id="review-card" class="review-card">
            <div class="flip-card-inner" id="flip-card-inner">
                <div id="card-front" class="card-side card-front">
                    <div class="card-label">Question</div>
                    <div class="card-content" id="front-content"></div>
                    <div class="card-tap-hint">Tapez pour voir la réponse</div>
                </div>
                <div id="card-back" class="card-side card-back">
                    <div class="card-label">Réponse</div>
                    <div class="card-content" id="back-content"></div>
                    <div class="card-tap-hint">Tapez pour revoir la question</div>
                </div>
            </div>
        </div>
        <div id="review-buttons" class="review-buttons hidden">
            <button id="again-btn" class="review-btn again">Encore</button>
            <button id="good-btn" class="review-btn good">Bien</button>
            <button id="easy-btn" class="review-btn easy">Facile</button>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Titre</h2>
                <button class="modal-close" aria-label="Fermer"><span class="icon-svg icon-close"></span></button>
            </div>
            <div class="modal-body">
                <div id="modal-content"></div>
            </div>
        </div>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
    <div id="hamburger-menu" class="hamburger-menu hidden">
        <div class="hamburger-menu-overlay"></div>
        <div class="hamburger-menu-content">
            <div class="hamburger-menu-header">
                <h2>Menu</h2>
                <button id="hamburger-close-btn" class="icon-btn" aria-label="Fermer"><span class="icon-svg icon-close"></span></button>
            </div>
            <div class="hamburger-menu-items" id="hamburger-menu-items"></div>
            <div class="hamburger-menu-footer">
                <div class="copyright">© 2026 Kenzo Metgy - Tous droits réservés</div>
            </div>
        </div>
    </div>
    <script src="supabase-umd.js"></script>
</body>
</html>
